<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Border Estimator</title>
  <style>
    /*
      This upgraded configurator uses CSS variables for theming. The variables
      are updated at runtime from the configuration object, giving non‑technical
      administrators control over colours without editing code.  The layout
      intentionally uses a simple, responsive grid so it works on phones,
      tablets and desktops.  Critical UI elements are sized with relative
      units and avoid fixed heights wherever possible.
    */
    :root {
      --primary: #3a9a3e;
      --secondary: #2d7a31;
      --background: #f8f8f8;
      --text: #1a1a1a;
    }
    body {
      margin: 0;
      font-family: sans-serif;
      background: var(--background);
      color: var(--text);
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    header img {
      height: 40px;
      margin-right: 1rem;
    }
    h1 {
      margin: 0;
      font-size: 1.4rem;
    }
    #app {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
    }
    .step {
      margin-bottom: 2rem;
    }
    .step h2 {
      margin-top: 0;
      font-size: 1.3rem;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 0.25rem;
    }
    .field {
      margin-bottom: 1rem;
    }
    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.3rem;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background: #ccc;
      cursor: default;
    }
    .card-list {
      display: grid;
      gap: 1rem;
    }
    @media (min-width: 600px) {
      .card-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 0.75rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: border-color 0.2s;
    }
    .card.selected {
      border-color: var(--primary);
    }
    .card .price {
      margin-top: auto;
      font-weight: bold;
      color: var(--primary);
    }
    /* Admin modal styles */
    #adminBtn {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 50;
      background: var(--secondary);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      line-height: 1;
      color: #fff;
    }
    #adminModal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .admin-content {
      background: #fff;
      max-height: 90vh;
      overflow-y: auto;
      width: 95%;
      max-width: 800px;
      border-radius: 8px;
      padding: 1rem;
    }
    .admin-content h3 {
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 0.25rem;
    }
    .admin-section {
      margin-bottom: 1.5rem;
    }
    .admin-section details {
      margin-top: 0.5rem;
    }
    .admin-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .admin-row input,
    .admin-row select,
    .admin-row textarea {
      width: 100%;
    }
    .list-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
      display: flex;
      flex-direction: column;
    }
    .list-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-item-header h4 {
      margin: 0;
      font-size: 1rem;
    }
    .list-item button {
      background: #e74c3c;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .toolbar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .toolbar button {
      padding: 0.4rem 0.6rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;">
      <img id="logoImg" alt="Logo" style="display:none;" />
      <h1 id="companyName">Company Name</h1>
    </div>
    <div id="priceBanner"></div>
  </header>
  <main id="app"></main>
  <button id="adminBtn" title="Admin">⚙</button>
  <!-- Admin modal -->
  <div id="adminModal">
    <div class="admin-content" id="adminContent"></div>
  </div>
  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // DEFAULT CONFIGURATION
    // SESSION 8 CHANGES:
    //   - Stamp is now the BASE RATE (not an adder on top of a global base).
    //     config.pricing.base is removed. Each stamp has a `rate` field.
    //   - Profile adder: Slant=0, Mow=0, Square has its own adder (admin sets).
    //   - Cable adder: $0.25/ft default, toggleable.
    //   - Two separate color adders: "Color" and "Integral Color", each
    //     independently toggleable and price-settable by admin.
    //   - Step order changed: Customer → Stamp → Profile → Extras → Footage
    //     → Notes → Summary  (was: Customer → Profile → Stamp → …)
    // ─────────────────────────────────────────────────────────────────────────
    const defaultConfig = {
      adminPin: '1234',
      business: {
        companyName: 'Great Northern Borders',
        phone: '(406) 555‑0100',
        email: 'info@greatnorthernborders.com',
        submissionEmail: 'quotes@greatnorthernborders.com',
        webhookUrl: '',
        website: 'https://greatnorthernborders.com',
        logoUrl: '',
        headerText: '',
        footerText: ''
      },
      branding: {
        primaryColor: '#3A9A3E',
        secondaryColor: '#2D7A31',
        backgroundColor: '#F8F8F8',
        textColor: '#1A1A1A'
      },
      pricing: {
        // Cable adder
        cableEnabled: true,
        cableAdder: 0.25,
        // Color adder (standard color — some stamps include color, so this can be toggled off)
        colorEnabled: true,
        colorAdder: 0.50,
        // Integral color adder (separate option)
        integralColorEnabled: true,
        integralColorAdder: 0.50
      },
      products: {
        // Profiles are shape/edge choices — they carry an optional price adder.
        // Square profile costs more; admin sets the adder. Slant and Mow are $0.
        profiles: [
          { id: 'slant',  name: 'Slant',  desc: 'Standard slant edge.',   series: 'Standard', price: 0,   imageUrl: '' },
          { id: 'mow',    name: 'Mow',    desc: 'Mow-over edge.',          series: 'Standard', price: 0,   imageUrl: '' },
          { id: 'square', name: 'Square', desc: 'Square edge — premium.', series: 'Standard', price: 0,   imageUrl: '' }
        ],
        // Stamps define the BASE RATE per linear foot.
        // `rate` replaces the old `price` adder field.
        // Plain and Great Northern have known rates; others are left at 0 for admin to set.
        stamps: [
          { id: 'plain',         name: 'Plain',         desc: 'Smooth finish, no texture.',  series: 'Basic',     rate: 10,  imageUrl: '' },
          { id: 'great',         name: 'Great Northern', desc: 'Our signature design.',       series: 'Signature', rate: 25,  imageUrl: '' },
          { id: 'granite',       name: 'Granite',        desc: 'Granite texture stamping.',   series: 'Texture',   rate: 0,   imageUrl: '' },
          { id: 'river',         name: 'River Rock',     desc: 'River rock texture.',         series: 'Texture',   rate: 0,   imageUrl: '' }
        ]
      },
      labels: {
        stepCustomer: 'Customer Info',
        stepStamp: 'Choose Stamp',
        stepProfile: 'Choose Profile',
        stepOptions: 'Extras',
        stepFootage: 'Footage',
        stepNotes: 'Notes',
        stepSummary: 'Summary',
        btnNext: 'Next →',
        btnBack: '← Back',
        btnSubmit: 'Send Estimate',
        btnPrint: 'Print',
        btnOps: '📋 Send to Ops Board',
        fieldName: 'Name',
        fieldEmail: 'Email',
        fieldPhone: 'Phone',
        fieldAddress: 'Address',
        fieldNotesPlaceholder: 'Any additional details about the project…',
        fieldFootage: 'Total linear feet',
        fieldNotes: 'Additional notes',
        labelCable: 'Cable reinforcement',
        labelColor: 'Color',
        labelIntegralColor: 'Integral Color',
        summaryCustomer: 'Customer',
        summaryStamp: 'Stamp',
        summaryProfile: 'Profile',
        summaryCable: 'Cable reinforcement',
        summaryColor: 'Color',
        summaryIntegralColor: 'Integral Color',
        summaryFootage: 'Footage',
        summaryPerFoot: 'Price per foot',
        summaryTotal: 'Total price',
        summaryNotes: 'Notes'
      },
      features: {
        enableCable: true,
        enableColor: true,
        enableIntegralColor: true,
        enableNotes: true,
        enablePrint: true,
        enableEmail: true,
        multiRun: false
      }
    };

    // Storage availability check.
    const storageAvailable = (() => {
      try {
        const x = '__storage_test__';
        localStorage.setItem(x, x);
        localStorage.removeItem(x);
        return true;
      } catch (e) {
        return false;
      }
    })();

    // Deep merge helper — fixes ISSUE-005 (shallow Object.assign drops nested keys).
    function deepMerge(target, source) {
      const out = Object.assign({}, target);
      Object.keys(source).forEach(key => {
        if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
          out[key] = deepMerge(target[key] || {}, source[key]);
        } else {
          out[key] = source[key];
        }
      });
      return out;
    }

    function loadConfig() {
      if (storageAvailable) {
        try {
          const stored = localStorage.getItem('config');
          if (stored) {
            return deepMerge(defaultConfig, JSON.parse(stored));
          }
        } catch (e) {
          console.warn('Config parse error or storage unavailable; using defaults.', e);
        }
      }
      return JSON.parse(JSON.stringify(defaultConfig));
    }

    let config = loadConfig();

    // ─────────────────────────────────────────────────────────────────────────
    // STEP CONSTANTS  (Session 8: Stamp moved to step 1, Profile to step 2)
    // ─────────────────────────────────────────────────────────────────────────
    const STEP_CUSTOMER = 0;
    const STEP_STAMP    = 1;
    const STEP_PROFILE  = 2;
    const STEP_OPTIONS  = 3;
    const STEP_FOOTAGE  = 4;
    const STEP_NOTES    = 5;
    const STEP_SUMMARY  = 6;

    // Application state
    let state = {
      step: STEP_CUSTOMER,
      customer: { name: '', email: '', phone: '', address: '' },
      stampId: null,
      profileId: null,
      cable: false,
      color: false,
      integralColor: false,
      footage: 0,
      notes: ''
    };

    // Utilities
    function formatCurrency(num) {
      return `$${Number(num).toFixed(2)}`;
    }
    function getProfileById(id) {
      return config.products.profiles.find(p => p.id === id);
    }
    function getStampById(id) {
      return config.products.stamps.find(s => s.id === id);
    }

    // ─────────────────────────────────────────────────────────────────────────
    // PRICING  — Stamp rate IS the base. Adders stack on top.
    // ─────────────────────────────────────────────────────────────────────────
    function calculatePricing() {
      const stamp   = getStampById(state.stampId);
      const profile = getProfileById(state.profileId);

      // Stamp rate is the base; fall back to 0 if no stamp selected yet.
      let perFoot = stamp ? (Number(stamp.rate) || 0) : 0;

      // Profile adder (Square may have a non-zero price; Slant/Mow are 0).
      if (profile) perFoot += Number(profile.price) || 0;

      // Extras adders
      if (config.pricing.cableEnabled && state.cable)
        perFoot += Number(config.pricing.cableAdder) || 0;
      if (config.pricing.colorEnabled && state.color)
        perFoot += Number(config.pricing.colorAdder) || 0;
      if (config.pricing.integralColorEnabled && state.integralColor)
        perFoot += Number(config.pricing.integralColorAdder) || 0;

      const total = perFoot * (Number(state.footage) || 0);
      return { perFoot, total };
    }

    // ─────────────────────────────────────────────────────────────────────────
    // RENDER
    // ─────────────────────────────────────────────────────────────────────────
    function renderHeader() {
      document.getElementById('companyName').textContent = config.business.companyName || 'Company';
      const logo = document.getElementById('logoImg');
      if (config.business.logoUrl) {
        logo.src = config.business.logoUrl;
        logo.style.display = 'block';
      } else {
        logo.style.display = 'none';
      }
      document.documentElement.style.setProperty('--primary',    config.branding.primaryColor);
      document.documentElement.style.setProperty('--secondary',  config.branding.secondaryColor);
      document.documentElement.style.setProperty('--background', config.branding.backgroundColor);
      document.documentElement.style.setProperty('--text',       config.branding.textColor);
      const pb = document.getElementById('priceBanner');
      const pricing = calculatePricing();
      pb.textContent = state.stampId ? `Price: ${formatCurrency(pricing.perFoot)}/ft` : '';
    }

    function render() {
      renderHeader();
      const app = document.getElementById('app');
      app.innerHTML = '';
      switch (state.step) {
        case STEP_CUSTOMER: renderCustomerStep(app);  break;
        case STEP_STAMP:    renderStampStep(app);     break;
        case STEP_PROFILE:  renderProfileStep(app);   break;
        case STEP_OPTIONS:  renderOptionsStep(app);   break;
        case STEP_FOOTAGE:  renderFootageStep(app);   break;
        case STEP_NOTES:    renderNotesStep(app);     break;
        case STEP_SUMMARY:  renderSummaryStep(app);   break;
      }
    }

    // ── Step 0: Customer Info ──────────────────────────────────────────────
    function renderCustomerStep(app) {
      const step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = `<h2>${config.labels.stepCustomer}</h2>`;
      const fieldLabelMap = {
        name:    config.labels.fieldName    || 'Name',
        email:   config.labels.fieldEmail   || 'Email',
        phone:   config.labels.fieldPhone   || 'Phone',
        address: config.labels.fieldAddress || 'Address'
      };
      ['name', 'email', 'phone', 'address'].forEach(key => {
        const field = document.createElement('div');
        field.className = 'field';
        const lbl = document.createElement('label');
        lbl.textContent = fieldLabelMap[key];
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.value = state.customer[key] || '';
        inp.oninput = () => { state.customer[key] = inp.value; };
        field.appendChild(lbl);
        field.appendChild(inp);
        step.appendChild(field);
      });
      const nav = document.createElement('div');
      nav.className = 'btn-row';
      const nextBtn = document.createElement('button');
      nextBtn.textContent = config.labels.btnNext;
      nextBtn.onclick = () => {
        if (!state.customer.name || !state.customer.email || !state.customer.phone || !state.customer.address) {
          alert('Please fill in all customer fields.');
        } else {
          state.step = STEP_STAMP;
          render();
        }
      };
      nav.appendChild(nextBtn);
      step.appendChild(nav);
      app.appendChild(step);
    }

    // ── Step 1: Stamp (BASE RATE) ──────────────────────────────────────────
    function renderStampStep(app) {
      const step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = `<h2>${config.labels.stepStamp}</h2>`;
      // Group stamps by series
      const seriesMap = {};
      config.products.stamps.forEach(p => {
        seriesMap[p.series] = seriesMap[p.series] || [];
        seriesMap[p.series].push(p);
      });
      Object.keys(seriesMap).forEach(series => {
        const title = document.createElement('h3');
        title.textContent = series;
        step.appendChild(title);
        const list = document.createElement('div');
        list.className = 'card-list';
        seriesMap[series].forEach(item => {
          const card = document.createElement('div');
          card.className = 'card' + (state.stampId === item.id ? ' selected' : '');
          // Display stamp rate as the full price (not an adder)
          const rateDisplay = item.rate > 0 ? `${formatCurrency(item.rate)}/ft` : 'Price TBD';
          card.innerHTML = `${item.imageUrl ? `<img src="${item.imageUrl}" style="width:100%;max-height:120px;object-fit:cover;border-radius:4px;margin-bottom:6px;">` : ''}<strong>${item.name}</strong><div>${item.desc}</div><div class="price">${rateDisplay}</div>`;
          card.onclick = () => {
            state.stampId = item.id;
            render();
          };
          list.appendChild(card);
        });
        step.appendChild(list);
      });
      const nav = document.createElement('div');
      nav.className = 'btn-row';
      const back = document.createElement('button');
      back.textContent = config.labels.btnBack;
      back.onclick = () => { state.step = STEP_CUSTOMER; render(); };
      const next = document.createElement('button');
      next.textContent = config.labels.btnNext;
      next.disabled = !state.stampId;
      next.onclick = () => { state.step = STEP_PROFILE; render(); };
      nav.appendChild(back);
      nav.appendChild(next);
      step.appendChild(nav);
      app.appendChild(step);
    }

    // ── Step 2: Profile (ADDER) ────────────────────────────────────────────
    function renderProfileStep(app) {
      const step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = `<h2>${config.labels.stepProfile}</h2>`;
      const seriesMap = {};
      config.products.profiles.forEach(p => {
        seriesMap[p.series] = seriesMap[p.series] || [];
        seriesMap[p.series].push(p);
      });
      Object.keys(seriesMap).forEach(series => {
        const title = document.createElement('h3');
        title.textContent = series;
        step.appendChild(title);
        const list = document.createElement('div');
        list.className = 'card-list';
        seriesMap[series].forEach(item => {
          const card = document.createElement('div');
          card.className = 'card' + (state.profileId === item.id ? ' selected' : '');
          // Show adder if non-zero, otherwise show "Included"
          const adderDisplay = item.price > 0 ? `+${formatCurrency(item.price)}/ft` : 'Included';
          card.innerHTML = `${item.imageUrl ? `<img src="${item.imageUrl}" style="width:100%;max-height:120px;object-fit:cover;border-radius:4px;margin-bottom:6px;">` : ''}<strong>${item.name}</strong><div>${item.desc}</div><div class="price">${adderDisplay}</div>`;
          card.onclick = () => {
            state.profileId = item.id;
            render();
          };
          list.appendChild(card);
        });
        step.appendChild(list);
      });
      const nav = document.createElement('div');
      nav.className = 'btn-row';
      const back = document.createElement('button');
      back.textContent = config.labels.btnBack;
      back.onclick = () => { state.step = STEP_STAMP; render(); };
      const next = document.createElement('button');
      next.textContent = config.labels.btnNext;
      next.disabled = !state.profileId;
      next.onclick = () => { state.step = STEP_OPTIONS; render(); };
      nav.appendChild(back);
      nav.appendChild(next);
      step.appendChild(nav);
      app.appendChild(step);
    }

    // ── Step 3: Extras (Adders) ────────────────────────────────────────────
    function renderOptionsStep(app) {
      const step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = `<h2>${config.labels.stepOptions}</h2>`;

      function addCheckbox(enabledFlag, adderKey, labelKey, stateKey) {
        if (!config.features[enabledFlag] || !config.pricing[adderKey.replace('Adder','Enabled')]) return;
        const field = document.createElement('div');
        field.className = 'field';
        const lbl = document.createElement('label');
        const adderVal = Number(config.pricing[adderKey]) || 0;
        lbl.textContent = `${config.labels[labelKey] || labelKey} (+${formatCurrency(adderVal)}/ft)`;
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!state[stateKey];
        cb.onchange = () => { state[stateKey] = cb.checked; renderHeader(); };
        field.appendChild(cb);
        field.appendChild(lbl);
        step.appendChild(field);
      }

      addCheckbox('enableCable',         'cableAdder',         'labelCable',         'cable');
      addCheckbox('enableColor',         'colorAdder',         'labelColor',         'color');
      addCheckbox('enableIntegralColor', 'integralColorAdder', 'labelIntegralColor', 'integralColor');

      const nav = document.createElement('div');
      nav.className = 'btn-row';
      const back = document.createElement('button');
      back.textContent = config.labels.btnBack;
      back.onclick = () => { state.step = STEP_PROFILE; render(); };
      const next = document.createElement('button');
      next.textContent = config.labels.btnNext;
      next.onclick = () => { state.step = STEP_FOOTAGE; render(); };
      nav.appendChild(back);
      nav.appendChild(next);
      step.appendChild(nav);
      app.appendChild(step);
    }

    // ── Step 4: Footage ────────────────────────────────────────────────────
    function renderFootageStep(app) {
      const step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = `<h2>${config.labels.stepFootage}</h2>`;
      const field = document.createElement('div');
      field.className = 'field';
      const lbl = document.createElement('label');
      lbl.textContent = config.labels.fieldFootage || 'Total linear feet';
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.min = '0';
      inp.value = state.footage || '';
      inp.oninput = () => {
        state.footage = inp.value;
        renderHeader();
        render();
      };
      field.appendChild(lbl);
      field.appendChild(inp);
      step.appendChild(field);
      const nav = document.createElement('div');
      nav.className = 'btn-row';
      const back = document.createElement('button');
      back.textContent = config.labels.btnBack;
      back.onclick = () => { state.step = STEP_OPTIONS; render(); };
      const next = document.createElement('button');
      next.textContent = config.labels.btnNext;
      next.disabled = !state.footage;
      next.onclick = () => { state.step = config.features.enableNotes ? STEP_NOTES : STEP_SUMMARY; render(); };
      nav.appendChild(back);
      nav.appendChild(next);
      step.appendChild(nav);
      app.appendChild(step);
    }

    // ── Step 5: Notes ──────────────────────────────────────────────────────
    function renderNotesStep(app) {
      const step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = `<h2>${config.labels.stepNotes}</h2>`;
      const field = document.createElement('div');
      field.className = 'field';
      const lbl = document.createElement('label');
      lbl.textContent = config.labels.fieldNotes || 'Additional notes';
      const ta = document.createElement('textarea');
      ta.rows = 4;
      ta.value = state.notes || '';
      ta.oninput = () => { state.notes = ta.value; };
      field.appendChild(lbl);
      field.appendChild(ta);
      step.appendChild(field);
      const nav = document.createElement('div');
      nav.className = 'btn-row';
      const back = document.createElement('button');
      back.textContent = config.labels.btnBack;
      back.onclick = () => { state.step = STEP_FOOTAGE; render(); };
      const next = document.createElement('button');
      next.textContent = config.labels.btnNext;
      next.onclick = () => { state.step = STEP_SUMMARY; render(); };
      nav.appendChild(back);
      nav.appendChild(next);
      step.appendChild(nav);
      app.appendChild(step);

    // ════════════════════════════════════════════
    // SUBMIT TO GNB OPS — Webhook + Transfer Code
    // ════════════════════════════════════════════
    const GNB_WEBHOOK_URL = config.business.webhookUrl || '';

    const TRANSFER_NOUNS = [
      'clock','dog','muffin','river','hammer','eagle','stone','cedar',
      'truck','badge','arrow','flame','moose','cabin','ridge','trail',
      'storm','forge','steel','maple','aspen','creek','summit','wolf',
      'bear','pine','slate','gravel','iron','copper','timber','boulder',
      'falcon','canyon','mesa','drift','frost','ember','flint','sage',
      'birch','oak','elk','hawk','bass','pike','trout','otter','lynx','fox'
    ];

    function generateTransferCode() {
      const noun = TRANSFER_NOUNS[Math.floor(Math.random() * TRANSFER_NOUNS.length)];
      const num  = Math.floor(Math.random() * 90) + 10;
      return noun + num;
    }

    function submitToOps(pricing, prof, stp) {
      const webhookUrl = config.business.webhookUrl || '';
      if (!webhookUrl) {
        alert('Ops webhook not configured. Go to Admin → Business Info and paste your GNB Ops Web App URL into the Webhook URL field.');
        return;
      }
      const code = generateTransferCode();
      const colorTags = [];
      if (state.color)         colorTags.push('Color');
      if (state.integralColor) colorTags.push('Integral Color');
      const jobData = {
        name:         state.customer.name    || '',
        phone:        state.customer.phone   || '',
        email:        state.customer.email   || '',
        address:      state.customer.address || '',
        type:         'hw',
        stamp:        stp  ? stp.name  : '',
        profile:      prof ? prof.name : '',
        footage:      state.footage || '',
        estimate:     formatCurrency(pricing.total),
        status:       'scheduled',
        colorPalette: colorTags,
        runs:         [],
        prepWork:     '',
        prepAmount:   '',
        bossNotes:    '',
        preNotes:     state.notes || '',
        transferCode: code
      };

      const opsBtn = document.querySelector('button[data-ops]');
      if (opsBtn) { opsBtn.disabled = true; opsBtn.textContent = 'Sending...'; }

      fetch(webhookUrl, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ action: 'submit-job', job: jobData }),
        mode:    'no-cors'
      }).then(() => {
        if (opsBtn) { opsBtn.textContent = '✓ Sent! Code: ' + code; opsBtn.style.background = '#2E7D4F'; }
        alert('Job sent to Ops Board!\n\nTransfer Code: ' + code + '\n\nUse this code on any device to pull the job into the War Board.');
      }).catch(err => {
        if (opsBtn) { opsBtn.disabled = false; opsBtn.textContent = config.labels.btnOps || '📋 Send to Ops Board'; }
        alert('Failed to send: ' + err.message + '\n\nMake sure the Webhook URL is correct in Admin settings.');
      });
    }

    function renderAdmin() {

      content.innerHTML = '';

        renderPinPad(content);

    function renderPinPad(content) {
      content.innerHTML = `
        <h2 style="margin-top:0;">Admin Access</h2>
        <div style="display:flex;gap:8px;justify-content:center;margin-bottom:1rem;">
          ${[0,1,2,3].map(i => `<div id="pinDot${i}" style="width:18px;height:18px;border-radius:50%;border:2px solid #333;background:transparent;"></div>`).join('')}
        </div>
        <div id="pinErr" style="color:red;text-align:center;min-height:1.2em;margin-bottom:.5rem;"></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;max-width:200px;margin:0 auto;">
          ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k =>
            k === ''
              ? `<div></div>`
              : `<button onclick="handlePin('${k}')" style="font-size:1.3rem;padding:.6rem;">${k}</button>`
          ).join('')}
        </div>
        <div style="text-align:center;margin-top:1rem;">
          <button onclick="closeAdmin()" style="background:#888;">Cancel</button>
        </div>`;
    }

    function handlePin(key) {
      if (key === '⌫') {
        pinEntry = pinEntry.slice(0, -1);
      } else {
        pinEntry += key;
      }
      for (let i = 0; i < 4; i++) {
        const d = document.getElementById('pinDot' + i);
        if (d) d.style.background = i < pinEntry.length ? '#333' : 'transparent';
      }
      if (pinEntry.length === 4) {
        if (pinEntry === String(config.adminPin)) {
          adminUnlocked = true;
          pinEntry = '';
          renderAdminPanel();
        } else {
          const errMsg = document.getElementById('pinErr');
          if (errMsg) errMsg.textContent = 'Incorrect PIN';
          pinEntry = '';
          for (let i = 0; i < 4; i++) {
            const d = document.getElementById('pinDot' + i);
            if (d) d.style.background = 'transparent';
          }
        }
      }
    }

      function makeImageField(label, getValue, setValue) {
        const wrap = document.createElement('div');
        wrap.className = 'field';
        const lbl = document.createElement('label');
        lbl.textContent = label;
        wrap.appendChild(lbl);
        const preview = document.createElement('img');
        preview.style.cssText = 'max-width:100%;max-height:80px;object-fit:contain;display:block;margin-bottom:6px;border-radius:4px;';
        if (getValue()) { preview.src = getValue(); } else { preview.style.display = 'none'; }
        wrap.appendChild(preview);
        const urlRow = document.createElement('div');
        urlRow.style.display = 'flex';
        urlRow.style.gap = '6px';
        urlRow.style.marginBottom = '4px';
        const urlInp = document.createElement('input');
        urlInp.type = 'text';
        urlInp.placeholder = 'Paste image URL…';
        urlInp.value = getValue() && !getValue().startsWith('data:') ? getValue() : '';
        urlInp.style.flex = '1';
        urlInp.oninput = () => {
          setValue(urlInp.value);
          preview.src = urlInp.value;
          preview.style.display = urlInp.value ? 'block' : 'none';
        };
        urlRow.appendChild(urlInp);
        wrap.appendChild(urlRow);
        const uploadBtn = document.createElement('button');
        uploadBtn.type = 'button';
        uploadBtn.textContent = '↑ Upload Image';
        uploadBtn.style.cssText = 'font-size:.8rem;padding:4px 10px;background:#555;';
        uploadBtn.onclick = () => {
          const fileInp = document.createElement('input');
          fileInp.type = 'file';
          fileInp.accept = 'image/*';
          fileInp.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              const dataUrl = ev.target.result;
              setValue(dataUrl);
              urlInp.value = '';
              urlInp.placeholder = file.name + ' (uploaded)';
              preview.src = dataUrl;
              preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
          };
          fileInp.click();
        };
        wrap.appendChild(uploadBtn);
        const clearBtn = document.createElement('button');
        clearBtn.type = 'button';
        clearBtn.textContent = 'Clear';
        clearBtn.style.cssText = 'font-size:.8rem;padding:4px 10px;background:#c0392b;margin-left:4px;';

          preview.style.display = 'none';

        return wrap;

      });
      content.appendChild(contentSec);

      // ── ADVANCED ─────────────────────────────────────────────────────────
      const adv = document.createElement('div');
      adv.className = 'admin-section';
      const details = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = 'Advanced Configuration';
      details.appendChild(summary);
      const advWrap = document.createElement('div');

      // PIN change
      const pinRow = document.createElement('div');
      pinRow.className = 'field';
      const pinLbl = document.createElement('label');
      pinLbl.textContent = 'Change Admin PIN';
      const pinInp = document.createElement('input');
      pinInp.type = 'password';
      pinInp.placeholder = 'New PIN';
      const pinBtn = document.createElement('button');
      pinBtn.textContent = 'Update PIN';
      pinBtn.onclick = () => {
        if (pinInp.value && pinInp.value.length >= 4) {
          config.adminPin = pinInp.value;
          pinInp.value = '';
          alert('PIN updated');
        } else {
          alert('PIN must be at least 4 digits.');
        }
      };
      pinRow.appendChild(pinLbl);
      pinRow.appendChild(pinInp);
      pinRow.appendChild(pinBtn);
      advWrap.appendChild(pinRow);

      // Feature toggles
      const featureLabels = {
        enableCable:         'Cable Option',
        enableColor:         'Color Option',
        enableIntegralColor: 'Integral Color Option',
        enableNotes:         'Notes Step',
        enablePrint:         'Print Button',
        enableEmail:         'Send Estimate Button',
        multiRun:            'Multi-Run Mode'
      };
      Object.keys(config.features).forEach(key => {
        const row = document.createElement('div');
        row.className = 'field';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = config.features[key];
        cb.onchange = () => { config.features[key] = cb.checked; };
        const lbl = document.createElement('label');
        lbl.textContent = featureLabels[key] || key.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
        row.appendChild(cb);
        row.appendChild(lbl);
        advWrap.appendChild(row);
      });

      // Import / Export / Reset / Portable HTML
      const tools = document.createElement('div');
      tools.className = 'toolbar';

      const exportBtn = document.createElement('button');
      exportBtn.textContent = 'Export Config';
      exportBtn.onclick = () => {
        const data = JSON.stringify(config, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = 'config.json'; a.click();
        URL.revokeObjectURL(url);
      };

      const importBtn = document.createElement('button');
      importBtn.textContent = 'Import Config';
      importBtn.onclick = () => {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = '.json';
        inp.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const obj = JSON.parse(ev.target.result);
              config = deepMerge(defaultConfig, obj);
              saveConfig();
              renderHeader();
              alert('Config imported successfully.');
            } catch (err) {
              alert('Invalid config file');
            }
            renderAdminPanel();
          };
          reader.readAsText(file);
        };
        inp.click();
      };

      const resetBtn = document.createElement('button');
      resetBtn.textContent = 'Restore Defaults';
      resetBtn.onclick = () => {
        if (confirm('Restore factory settings?')) {
          config = JSON.parse(JSON.stringify(defaultConfig));
          saveConfig();
          renderHeader();
          renderAdminPanel();
        }
      };

      // Export Portable HTML — bakes current config into a standalone file
      const portableBtn = document.createElement('button');
      portableBtn.textContent = 'Export Portable HTML';
      portableBtn.style.background = '#2d7a31';
      portableBtn.onclick = () => {
        try {
          const liveConfig = JSON.stringify(config, null, 10);
          const source = document.documentElement.outerHTML;
          const marker = /const defaultConfig\s*=\s*\{[\s\S]*?\}\s*;\s*(?=\/\/\s*Storage)/;
          if (!marker.test(source)) {
            alert('Could not locate config block in source. Export failed.');
            return;
          }
          const patched = source.replace(marker, 'const defaultConfig = ' + liveConfig + ';\n\n    ');
          const blob = new Blob([patched], { type: 'text/html' });
          const url  = URL.createObjectURL(blob);
          const a    = document.createElement('a');
          a.href = url;
          const today = new Date().toISOString().slice(0, 10);
          a.download = 'gnb-configurator-' + today + '.html';
          a.click();
          URL.revokeObjectURL(url);
        } catch(err) {
          alert('Export failed: ' + err.message);
        }
      };

      tools.appendChild(exportBtn);
      tools.appendChild(importBtn);
      tools.appendChild(resetBtn);
      tools.appendChild(portableBtn);
      advWrap.appendChild(tools);
      details.appendChild(advWrap);
      adv.appendChild(details);
      content.appendChild(adv);

      // Save & Close
      const actions = document.createElement('div');
      actions.className = 'btn-row';
      const saveBtn = document.createElement('button');
      saveBtn.textContent = 'Save';
      saveBtn.onclick = () => {
        saveConfig();
        adminUnlocked = false;
        closeAdmin();
        render();
      };
      const cancelBtn = document.createElement('button');
      cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = () => { adminUnlocked = false; closeAdmin(); };
      actions.appendChild(cancelBtn);
      actions.appendChild(saveBtn);
      content.appendChild(actions);
    }

    function saveConfig() {
      if (storageAvailable) {
        try {
          localStorage.setItem('config', JSON.stringify(config));
        } catch (e) {
          console.warn('Unable to save config to storage', e);
        }
      }
    }

    // Event listeners
    document.getElementById('adminBtn').addEventListener('click', openAdmin);
    document.getElementById('adminModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('adminModal')) {
        adminUnlocked = false;
        closeAdmin();
      }
    });

    // Initial render
    render();
  </script>
</body>
</html>
