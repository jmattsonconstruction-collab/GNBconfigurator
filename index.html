<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Border Estimator</title>
  <style>
    /*
      This upgraded configurator uses CSS variables for theming. The variables
      are updated at runtime from the configuration object, giving non‑technical
      administrators control over colours without editing code.  The layout
      intentionally uses a simple, responsive grid so it works on phones,
      tablets and desktops.  Critical UI elements are sized with relative
      units and avoid fixed heights wherever possible.
    */
    :root {
      --primary: #3a9a3e;
      --secondary: #2d7a31;
      --background: #f8f8f8;
      --text: #1a1a1a;
    }
    body {
      margin: 0;
      font-family: sans-serif;
      background: var(--background);
      color: var(--text);
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    header img {
      height: 40px;
      margin-right: 1rem;
    }
    h1 {
      margin: 0;
      font-size: 1.4rem;
    }
    #app {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
    }
    .step {
      margin-bottom: 2rem;
    }
    .step h2 {
      margin-top: 0;
      font-size: 1.3rem;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 0.25rem;
    }
    .field {
      margin-bottom: 1rem;
    }
    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.3rem;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background: #ccc;
      cursor: default;
    }
    .card-list {
      display: grid;
      gap: 1rem;
    }
    @media (min-width: 600px) {
      .card-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 0.75rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: border-color 0.2s;
    }
    .card.selected {
      border-color: var(--primary);
    }
    .card .price {
      margin-top: auto;
      font-weight: bold;
      color: var(--primary);
    }
    /* Admin modal styles */
    #adminBtn {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 50;
      background: var(--secondary);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      line-height: 1;
      color: #fff;
    }
    #adminModal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .admin-content {
      background: #fff;
      max-height: 90vh;
      overflow-y: auto;
      width: 95%;
      max-width: 800px;
      border-radius: 8px;
      padding: 1rem;
    }
    .admin-content h3 {
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 0.25rem;
    }
    .admin-section {
      margin-bottom: 1.5rem;
    }
    .admin-section details {
      margin-top: 0.5rem;
    }
    .admin-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .admin-row input,
    .admin-row select,
    .admin-row textarea {
      width: 100%;
    }
    .list-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
      display: flex;
      flex-direction: column;
    }
    .list-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-item-header h4 {
      margin: 0;
      font-size: 1rem;
    }
    .list-item button {
      background: #e74c3c;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .toolbar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .toolbar button {
      padding: 0.4rem 0.6rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;">
      <img id="logoImg" alt="Logo" style="display:none;" />
      <h1 id="companyName">Company Name</h1>
    </div>
    <div id="priceBanner"></div>
  </header>
  <main id="app"></main>
  <button id="adminBtn" title="Admin">⚙</button>
  <!-- Admin modal -->
  <div id="adminModal">
    <div class="admin-content" id="adminContent"></div>
  </div>
  <script>
    // Default configuration.  Administrators can override these settings via
    // the admin panel.  The structure is intentionally verbose to make
    // available settings obvious.
    const defaultConfig = {
      adminPin: '1234',
      business: {
        companyName: 'Great Northern Borders',
        phone: '(406) 555‑0100',
        email: 'info@greatnorthernborders.com',
        submissionEmail: 'quotes@greatnorthernborders.com',
        website: 'https://greatnorthernborders.com',
        logoUrl: '',
        headerText: '',
        footerText: ''
      },
      branding: {
        primaryColor: '#3A9A3E',
        secondaryColor: '#2D7A31',
        backgroundColor: '#F8F8F8',
        textColor: '#1A1A1A'
      },
      pricing: {
        base: 10.0,
        cableEnabled: true,
        cableAdder: 0.75,
        colorEnabled: true,
        colorAdder: 0.5
      },
      products: {
        profiles: [
          { id: 'great', name: 'Great Northern', desc: 'Our signature design.', series: 'Mountain', price: 0 },
          { id: 'mountain', name: 'Badrock Canyon', desc: 'Beautiful stone textures.', series: 'Mountain', price: 2.5 },
          { id: 'scapegoat', name: 'Scapegoat', desc: 'Rugged, rustic edging.', series: 'Wilderness', price: 3.5 }
        ],
        stamps: [
          { id: 'no', name: 'No Stamp', desc: 'Smooth finish with no texture.', series: 'Basic', price: 0 },
          { id: 'granite', name: 'Granite', desc: 'Granite texture stamping.', series: 'Mountain', price: 1.5 },
          { id: 'river', name: 'River Rock', desc: 'River rock texture.', series: 'Wilderness', price: 2 }
        ]
      },
      labels: {
        stepCustomer: 'Customer Info',
        stepProfile: 'Choose Profile',
        stepStamp: 'Choose Stamp',
        stepOptions: 'Extras',
        stepFootage: 'Footage',
        stepNotes: 'Notes',
        stepSummary: 'Summary',
        btnNext: 'Next →',
        btnBack: '← Back',
        btnSubmit: 'Send Estimate',
        btnPrint: 'Print'
      },
      features: {
        enableCable: true,
        enableColor: true,
        enableNotes: true,
        enablePrint: true,
        enableEmail: true,
        multiRun: false
      }
    };

    // Storage availability check.  Some mobile browsers (e.g. Safari when
    // running local files or private mode) disable localStorage entirely and
    // will throw a SecurityError when attempting to read/write.  To ensure
    // the configurator still loads in those environments we detect
    // availability once up front.
    const storageAvailable = (() => {
      try {
        const x = '__storage_test__';
        localStorage.setItem(x, x);
        localStorage.removeItem(x);
        return true;
      } catch (e) {
        return false;
      }
    })();

    // Load configuration from storage or fall back to default.  We deep‑clone
    // defaultConfig to avoid accidental mutation.  An admin can always reset
    // to factory defaults via the advanced section.
    function loadConfig() {
      if (storageAvailable) {
        try {
          const stored = localStorage.getItem('config');
          if (stored) {
            return Object.assign({}, defaultConfig, JSON.parse(stored));
          }
        } catch (e) {
          console.warn('Config parse error or storage unavailable; using defaults.', e);
        }
      }
      return JSON.parse(JSON.stringify(defaultConfig));
    }

    let config = loadConfig();

    // Application state stores user selections and current step.  It is
    // intentionally simple; complex logic like price calculation is kept in
    // dedicated functions.
    let state = {
      step: 0,
      customer: { name: '', email: '', phone: '', address: '' },
      profileId: null,
      stampId: null,
      cable: false,
      color: false,
      footage: 0,
      notes: ''
    };

    // Utilities
    function formatCurrency(num) {
      return `$${num.toFixed(2)}`;
    }
    function getProfileById(id) {
      return config.products.profiles.find(p => p.id === id);
    }
    function getStampById(id) {
      return config.products.stamps.find(s => s.id === id);
    }

    // Calculate price per foot and total.
    function calculatePricing() {
      const base = Number(config.pricing.base) || 0;
      let perFoot = base;
      const profile = getProfileById(state.profileId);
      const stamp = getStampById(state.stampId);
      if (profile) perFoot += Number(profile.price) || 0;
      if (stamp) perFoot += Number(stamp.price) || 0;
      if (config.pricing.cableEnabled && state.cable) perFoot += Number(config.pricing.cableAdder) || 0;
      if (config.pricing.colorEnabled && state.color) perFoot += Number(config.pricing.colorAdder) || 0;
      const total = perFoot * (Number(state.footage) || 0);
      return { perFoot, total };
    }

    // Render functions for each step.  The root element is cleared and
    // repopulated on every render call.  This simple approach avoids
    // complicated stateful DOM manipulation.
    function renderHeader() {
      document.getElementById('companyName').textContent = config.business.companyName || 'Company';
      const logo = document.getElementById('logoImg');
      if (config.business.logoUrl) {
        logo.src = config.business.logoUrl;
        logo.style.display = 'block';
      } else {
        logo.style.display = 'none';
      }
      // update theme colours
      document.documentElement.style.setProperty('--primary', config.branding.primaryColor);
      document.documentElement.style.setProperty('--secondary', config.branding.secondaryColor);
      document.documentElement.style.setProperty('--background', config.branding.backgroundColor);
      document.documentElement.style.setProperty('--text', config.branding.textColor);
      // price banner (optional)
      const pb = document.getElementById('priceBanner');
      const pricing = calculatePricing();
      pb.textContent = state.profileId ? `Price: ${formatCurrency(pricing.perFoot)}/ft` : '';
    }

    function render() {
      renderHeader();
      const app = document.getElementById('app');
      app.innerHTML = '';
      switch (state.step) {
        case 0:
          renderCustomerStep(app);
          break;
        case 1:
          renderProfileStep(app);
          break;
        case 2:
          renderStampStep(app);
          break;
        case 3:
          renderOptionsStep(app);
          break;
        case 4:
          renderFootageStep(app);
          break;
        case 5:
          renderNotesStep(app);
          break;
        case 6:
          renderSummaryStep(app);
          break;
      }
    }

    function renderCustomerStep(app) {
      const step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = `<h2>${config.labels.stepCustomer}</h2>`;
      // fields
      ['name', 'email', 'phone', 'address'].forEach(key => {
        const field = document.createElement('div');
        field.className = 'field';
        const lbl = document.createElement('label');
        lbl.textContent = key.charAt(0).toUpperCase() + key.slice(1);
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.value = state.customer[key] || '';
        inp.oninput = () => {
          state.customer[key] = inp.value;
        };
        field.appendChild(lbl);
        field.appendChild(inp);
        step.appendChild(field);
      });
      // navigation
      const nav = document.createElement('div');
      nav.className = 'btn-row';
      const nextBtn = document.createElement('button');
      nextBtn.textContent = config.labels.btnNext;
      nextBtn.onclick = () => {
        if (!state.customer.name || !state.customer.email || !state.customer.phone || !state.customer.address) {
          alert('Please fill in all customer fields.');
        } else {
          state.step = 1;
          render();
        }
      };
      nav.appendChild(nextBtn);
      step.appendChild(nav);
      app.appendChild(step);
    }

    function renderProfileStep(app) {
      const step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = `<h2>${config.labels.stepProfile}</h2>`;
      // group profiles by series
      const seriesMap = {};
      config.products.profiles.forEach(p => {
        seriesMap[p.series] = seriesMap[p.series] || [];
        seriesMap[p.series].push(p);
      });
      Object.keys(seriesMap).forEach(series => {
        const title = document.createElement('h3');
        title.textContent = series;
        step.appendChild(title);
        const list = document.createElement('div');
        list.className = 'card-list';
        seriesMap[series].forEach(item => {
          const card = document.createElement('div');
          card.className = 'card' + (state.profileId === item.id ? ' selected' : '');
          card.innerHTML = `<strong>${item.name}</strong><div>${item.desc}</div><div class="price">+${formatCurrency(item.price)}/ft</div>`;
          card.onclick = () => {
            state.profileId = item.id;
            // reset dependent selections
            render();
          };
          list.appendChild(card);
        });
        step.appendChild(list);
      });
      // nav
      const nav = document.createElement('div');
      nav.className = 'btn-row';
      const back = document.createElement('button');
      back.textContent = config.labels.btnBack;
      back.onclick = () => { state.step = 0; render(); };
      const next = document.createElement('button');
      next.textContent = config.labels.btnNext;
      next.disabled = !state.profileId;
      next.onclick = () => { state.step = 2; render(); };
      nav.appendChild(back);
      nav.appendChild(next);
      step.appendChild(nav);
      app.appendChild(step);
    }

    function renderStampStep(app) {
      const step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = `<h2>${config.labels.stepStamp}</h2>`;
      // group stamps
      const seriesMap = {};
      config.products.stamps.forEach(p => {
        seriesMap[p.series] = seriesMap[p.series] || [];
        seriesMap[p.series].push(p);
      });
      Object.keys(seriesMap).forEach(series => {
        const title = document.createElement('h3');
        title.textContent = series;
        step.appendChild(title);
        const list = document.createElement('div');
        list.className = 'card-list';
        seriesMap[series].forEach(item => {
          const card = document.createElement('div');
          card.className = 'card' + (state.stampId === item.id ? ' selected' : '');
          card.innerHTML = `<strong>${item.name}</strong><div>${item.desc}</div><div class="price">+${formatCurrency(item.price)}/ft</div>`;
          card.onclick = () => {
            state.stampId = item.id;
            render();
          };
          list.appendChild(card);
        });
        step.appendChild(list);
      });
      const nav = document.createElement('div');
      nav.className = 'btn-row';
      const back = document.createElement('button');
      back.textContent = config.labels.btnBack;
      back.onclick = () => { state.step = 1; render(); };
      const next = document.createElement('button');
      next.textContent = config.labels.btnNext;
      next.disabled = !state.stampId;
      next.onclick = () => { state.step = 3; render(); };
      nav.appendChild(back);
      nav.appendChild(next);
      step.appendChild(nav);
      app.appendChild(step);
    }

    function renderOptionsStep(app) {
      const step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = `<h2>${config.labels.stepOptions}</h2>`;
      // cable
      if (config.features.enableCable && config.pricing.cableEnabled) {
        const field = document.createElement('div');
        field.className = 'field';
        const lbl = document.createElement('label');
        lbl.textContent = `Cable reinforcement (+${formatCurrency(config.pricing.cableAdder)}/ft)`;
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!state.cable;
        cb.onchange = () => { state.cable = cb.checked; renderHeader(); };
        field.appendChild(cb);
        field.appendChild(lbl);
        step.appendChild(field);
      }
      // color
      if (config.features.enableColor && config.pricing.colorEnabled) {
        const field = document.createElement('div');
        field.className = 'field';
        const lbl = document.createElement('label');
        lbl.textContent = `Integral colour (+${formatCurrency(config.pricing.colorAdder)}/ft)`;
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!state.color;
        cb.onchange = () => { state.color = cb.checked; renderHeader(); };
        field.appendChild(cb);
        field.appendChild(lbl);
        step.appendChild(field);
      }
      const nav = document.createElement('div');
      nav.className = 'btn-row';
      const back = document.createElement('button');
      back.textContent = config.labels.btnBack;
      back.onclick = () => { state.step = 2; render(); };
      const next = document.createElement('button');
      next.textContent = config.labels.btnNext;
      next.onclick = () => { state.step = 4; render(); };
      nav.appendChild(back);
      nav.appendChild(next);
      step.appendChild(nav);
      app.appendChild(step);
    }

    function renderFootageStep(app) {
      const step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = `<h2>${config.labels.stepFootage}</h2>`;
      const field = document.createElement('div');
      field.className = 'field';
      const lbl = document.createElement('label');
      lbl.textContent = 'Total linear feet';
      const inp = document.createElement('input');
      inp.type = 'number';
      inp.min = '0';
      inp.value = state.footage || '';
      inp.oninput = () => {
        state.footage = inp.value;
        // update header and re‑render this step to enable/disable the next button
        renderHeader();
        render();
      };
      field.appendChild(lbl);
      field.appendChild(inp);
      step.appendChild(field);
      const nav = document.createElement('div');
      nav.className = 'btn-row';
      const back = document.createElement('button');
      back.textContent = config.labels.btnBack;
      back.onclick = () => { state.step = 3; render(); };
      const next = document.createElement('button');
      next.textContent = config.labels.btnNext;
      next.disabled = !state.footage;
      next.onclick = () => { state.step = config.features.enableNotes ? 5 : 6; render(); };
      nav.appendChild(back);
      nav.appendChild(next);
      step.appendChild(nav);
      app.appendChild(step);
    }

    function renderNotesStep(app) {
      const step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = `<h2>${config.labels.stepNotes}</h2>`;
      const field = document.createElement('div');
      field.className = 'field';
      const lbl = document.createElement('label');
      lbl.textContent = 'Additional notes';
      const ta = document.createElement('textarea');
      ta.rows = 4;
      ta.value = state.notes || '';
      ta.oninput = () => { state.notes = ta.value; };
      field.appendChild(lbl);
      field.appendChild(ta);
      step.appendChild(field);
      const nav = document.createElement('div');
      nav.className = 'btn-row';
      const back = document.createElement('button');
      back.textContent = config.labels.btnBack;
      back.onclick = () => { state.step = 4; render(); };
      const next = document.createElement('button');
      next.textContent = config.labels.btnNext;
      next.onclick = () => { state.step = 6; render(); };
      nav.appendChild(back);
      nav.appendChild(next);
      step.appendChild(nav);
      app.appendChild(step);
    }

    function renderSummaryStep(app) {
      const step = document.createElement('div');
      step.className = 'step';
      step.innerHTML = `<h2>${config.labels.stepSummary}</h2>`;
      const pricing = calculatePricing();
      const list = document.createElement('ul');
      list.style.listStyle = 'none';
      list.style.padding = '0';
      function addItem(label, value) {
        const li = document.createElement('li');
        li.style.marginBottom = '0.5rem';
        li.innerHTML = `<strong>${label}:</strong> ${value}`;
        list.appendChild(li);
      }
      addItem('Customer', `${state.customer.name} — ${state.customer.address}`);
      const prof = getProfileById(state.profileId);
      if (prof) addItem('Profile', prof.name + (prof.price ? ` (+${formatCurrency(prof.price)}/ft)` : ''));
      const stp = getStampById(state.stampId);
      if (stp) addItem('Stamp', stp.name + (stp.price ? ` (+${formatCurrency(stp.price)}/ft)` : ''));
      if (config.pricing.cableEnabled) addItem('Cable reinforcement', state.cable ? `Yes (+${formatCurrency(config.pricing.cableAdder)}/ft)` : 'No');
      if (config.pricing.colorEnabled) addItem('Integral colour', state.color ? `Yes (+${formatCurrency(config.pricing.colorAdder)}/ft)` : 'No');
      addItem('Footage', `${state.footage} ft`);
      addItem('Price per foot', formatCurrency(pricing.perFoot));
      addItem('Total price', formatCurrency(pricing.total));
      if (state.notes) addItem('Notes', state.notes);
      step.appendChild(list);
      const nav = document.createElement('div');
      nav.className = 'btn-row';
      const back = document.createElement('button');
      back.textContent = config.labels.btnBack;
      back.onclick = () => { state.step = config.features.enableNotes ? 5 : 4; render(); };
      nav.appendChild(back);
      if (config.features.enablePrint) {
        const printBtn = document.createElement('button');
        printBtn.textContent = config.labels.btnPrint;
        printBtn.onclick = () => {
          window.print();
        };
        nav.appendChild(printBtn);
      }
      if (config.features.enableEmail) {
          const sendBtn = document.createElement('button');
          sendBtn.textContent = config.labels.btnSubmit;
          sendBtn.onclick = () => {
            const lines = [];
            lines.push('Estimate for ' + state.customer.name);
            lines.push('Address: ' + state.customer.address);
            if (prof) lines.push('Profile: ' + prof.name);
            if (stp) lines.push('Stamp: ' + stp.name);
            if (config.pricing.cableEnabled) lines.push('Cable reinforcement: ' + (state.cable ? 'Yes' : 'No'));
            if (config.pricing.colorEnabled) lines.push('Integral colour: ' + (state.color ? 'Yes' : 'No'));
            lines.push('Footage: ' + state.footage + ' ft');
            lines.push('Price per foot: ' + formatCurrency(pricing.perFoot));
            lines.push('Total price: ' + formatCurrency(pricing.total));
            if (state.notes) lines.push('Notes: ' + state.notes);
            const subj = 'New Estimate — ' + state.customer.address;
            const body = encodeURIComponent(lines.join('\n'));
            const to = encodeURIComponent(config.business.submissionEmail || config.business.email);
            window.location.href = `mailto:${to}?subject=${encodeURIComponent(subj)}&body=${body}`;
          };
          nav.appendChild(sendBtn);
      }
      step.appendChild(nav);
      app.appendChild(step);
    }

    // Admin panel logic.  When admin button is clicked the user is
    // prompted for a PIN.  Upon successful entry the panel appears.
    let adminUnlocked = false;
    let pinEntry = '';
    function openAdmin() {
      const modal = document.getElementById('adminModal');
      modal.style.display = 'flex';
      renderAdmin();
    }
    function closeAdmin() {
      document.getElementById('adminModal').style.display = 'none';
      pinEntry = '';
    }
    function renderAdmin() {
      const content = document.getElementById('adminContent');
      content.innerHTML = '';
      // if not unlocked, show pin screen
      if (!adminUnlocked) {
        const wrap = document.createElement('div');
        wrap.style.textAlign = 'center';
        wrap.innerHTML = '<h2>Admin Access</h2><p>Enter PIN</p>';
        const dots = document.createElement('div');
        for (let i = 0; i < 4; i++) {
          const d = document.createElement('span');
          d.id = 'pinDot' + i;
          d.style.display = 'inline-block';
          d.style.width = '8px';
          d.style.height = '8px';
          d.style.borderRadius = '50%';
          d.style.margin = '0 4px';
          d.style.border = '1px solid var(--primary)';
          wrap.appendChild(d);
        }
        const keypad = document.createElement('div');
        keypad.style.display = 'grid';
        keypad.style.gridTemplateColumns = 'repeat(3, 1fr)';
        keypad.style.gap = '0.5rem';
        keypad.style.marginTop = '1rem';
        const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','✔'];
        keys.forEach(k => {
          const btn = document.createElement('button');
          btn.textContent = k;
          btn.onclick = () => handlePinKey(k);
          keypad.appendChild(btn);
        });
        wrap.appendChild(keypad);
        const err = document.createElement('div');
        err.id = 'pinErr';
        err.style.color = '#e74c3c';
        err.style.marginTop = '0.5rem';
        wrap.appendChild(err);
        const closeBtn = document.createElement('button');
        closeBtn.textContent = 'Close';
        closeBtn.style.marginTop = '1rem';
        closeBtn.onclick = closeAdmin;
        wrap.appendChild(closeBtn);
        content.appendChild(wrap);
      } else {
        renderAdminPanel();
      }
    }
    function handlePinKey(k) {
      const err = document.getElementById('pinErr');
      if (err) err.textContent = '';
      if (k === '⌫') {
        pinEntry = pinEntry.slice(0, -1);
      } else if (k === '✔') {
        // ignore check button for now
        return;
      } else {
        if (pinEntry.length < 4) pinEntry += k;
      }
      // update dots
      for (let i = 0; i < 4; i++) {
        const d = document.getElementById('pinDot' + i);
        if (d) {
          d.style.background = i < pinEntry.length ? 'var(--primary)' : 'transparent';
        }
      }
      if (pinEntry.length === 4) {
        if (pinEntry === config.adminPin) {
          adminUnlocked = true;
          pinEntry = '';
          renderAdmin();
        } else {
          const errMsg = document.getElementById('pinErr');
          if (errMsg) errMsg.textContent = 'Incorrect PIN';
          pinEntry = '';
          for (let i = 0; i < 4; i++) {
            const d = document.getElementById('pinDot' + i);
            if (d) d.style.background = 'transparent';
          }
        }
      }
    }

    function renderAdminPanel() {
      const content = document.getElementById('adminContent');
      content.innerHTML = '';
      const heading = document.createElement('h2');
      heading.textContent = 'Admin Panel';
      content.appendChild(heading);
      // Standard settings
      const std = document.createElement('div');
      std.className = 'admin-section';
      std.innerHTML = '<h3>Standard Settings</h3>';
      // business info
      ['companyName','phone','email','submissionEmail','website','logoUrl'].forEach(key => {
        const row = document.createElement('div');
        row.className = 'field';
        const lbl = document.createElement('label');
        lbl.textContent = key.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.value = config.business[key] || '';
        inp.oninput = () => { config.business[key] = inp.value; renderHeader(); };
        row.appendChild(lbl);
        row.appendChild(inp);
        std.appendChild(row);
      });
      // theme colours
      ['primaryColor','secondaryColor','backgroundColor','textColor'].forEach(key => {
        const row = document.createElement('div');
        row.className = 'field';
        const lbl = document.createElement('label');
        lbl.textContent = key.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
        const inp = document.createElement('input');
        inp.type = 'color';
        inp.value = config.branding[key] || '#ffffff';
        inp.oninput = () => { config.branding[key] = inp.value; renderHeader(); };
        row.appendChild(lbl);
        row.appendChild(inp);
        std.appendChild(row);
      });
      // pricing simple
      ['base','cableAdder','colorAdder'].forEach(key => {
        const row = document.createElement('div');
        row.className = 'field';
        const lbl = document.createElement('label');
        lbl.textContent = key.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.step = '0.01';
        inp.min = '0';
        inp.value = config.pricing[key];
        inp.oninput = () => { config.pricing[key] = parseFloat(inp.value) || 0; renderHeader(); };
        row.appendChild(lbl);
        row.appendChild(inp);
        std.appendChild(row);
      });
      // toggles
      [['cableEnabled','Cable Enabled'], ['colorEnabled','Colour Enabled']].forEach(([prop,label]) => {
        const row = document.createElement('div');
        row.className = 'field';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = config.pricing[prop];
        cb.onchange = () => { config.pricing[prop] = cb.checked; renderHeader(); };
        const lblEl = document.createElement('label');
        lblEl.textContent = label;
        row.appendChild(cb);
        row.appendChild(lblEl);
        std.appendChild(row);
      });
      // product lists (profiles and stamps)
      function renderList(sectionTitle, arr, type) {
        const sec = document.createElement('div');
        sec.className = 'admin-section';
        sec.innerHTML = `<h3>${sectionTitle}</h3>`;
        arr.forEach((item, index) => {
          const li = document.createElement('div');
          li.className = 'list-item';
          const header = document.createElement('div');
          header.className = 'list-item-header';
          const title = document.createElement('h4');
          title.textContent = item.name || '(Unnamed)';
          const del = document.createElement('button');
          del.textContent = 'Delete';
          del.onclick = () => {
            if (confirm('Delete this item?')) {
              arr.splice(index, 1);
              renderAdminPanel();
            }
          };
          header.appendChild(title);
          header.appendChild(del);
          li.appendChild(header);
          // fields for item
          ['name','desc','series','price'].forEach(key => {
            const f = document.createElement('div');
            f.className = 'field';
            const lbl = document.createElement('label');
            lbl.textContent = key.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
            const inp = document.createElement(key === 'price' ? 'input' : 'input');
            if (key === 'price') {
              inp.type = 'number';
              inp.step = '0.01';
              inp.min = '0';
            } else {
              inp.type = 'text';
            }
            inp.value = item[key] || '';
            inp.oninput = () => {
              item[key] = key === 'price' ? parseFloat(inp.value) || 0 : inp.value;
              renderHeader();
            };
            f.appendChild(lbl);
            f.appendChild(inp);
            li.appendChild(f);
          });
          sec.appendChild(li);
        });
        // Add new
        const addBtn = document.createElement('button');
        addBtn.textContent = 'Add New';
        addBtn.onclick = () => {
          arr.push({ id: type + '-' + Date.now(), name: '', desc: '', series: '', price: 0 });
          renderAdminPanel();
        };
        sec.appendChild(addBtn);
        return sec;
      }
      std.appendChild(renderList('Profiles', config.products.profiles, 'profile'));
      std.appendChild(renderList('Stamps', config.products.stamps, 'stamp'));
      content.appendChild(std);
      // Advanced settings collapsible
      const adv = document.createElement('div');
      adv.className = 'admin-section';
      const details = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = 'Advanced Configuration';
      details.appendChild(summary);
      const advWrap = document.createElement('div');
      // PIN change
      const pinRow = document.createElement('div');
      pinRow.className = 'field';
      const pinLbl = document.createElement('label');
      pinLbl.textContent = 'Change Admin PIN';
      const pinInp = document.createElement('input');
      pinInp.type = 'password';
      pinInp.placeholder = 'New PIN';
      const pinBtn = document.createElement('button');
      pinBtn.textContent = 'Update PIN';
      pinBtn.onclick = () => {
        if (pinInp.value && pinInp.value.length >= 4) {
          config.adminPin = pinInp.value;
          pinInp.value = '';
          alert('PIN updated');
        } else {
          alert('PIN must be at least 4 digits.');
        }
      };
      pinRow.appendChild(pinLbl);
      pinRow.appendChild(pinInp);
      pinRow.appendChild(pinBtn);
      advWrap.appendChild(pinRow);
      // feature toggles
      Object.keys(config.features).forEach(key => {
        const row = document.createElement('div');
        row.className = 'field';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = config.features[key];
        cb.onchange = () => { config.features[key] = cb.checked; };
        const lbl = document.createElement('label');
        lbl.textContent = key.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase());
        row.appendChild(cb);
        row.appendChild(lbl);
        advWrap.appendChild(row);
      });
      // Import/export and reset
      const tools = document.createElement('div');
      tools.className = 'toolbar';
      const exportBtn = document.createElement('button');
      exportBtn.textContent = 'Export Config';
      exportBtn.onclick = () => {
        const data = JSON.stringify(config, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'config.json';
        a.click();
        URL.revokeObjectURL(url);
      };
      const importBtn = document.createElement('button');
      importBtn.textContent = 'Import Config';
      importBtn.onclick = () => {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = '.json';
        inp.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const obj = JSON.parse(ev.target.result);
              config = Object.assign({}, defaultConfig, obj);
              saveConfig();
              renderHeader();
              alert('Config imported');
            } catch (err) {
              alert('Invalid config file');
            }
            renderAdminPanel();
          };
          reader.readAsText(file);
        };
        inp.click();
      };
      const resetBtn = document.createElement('button');
      resetBtn.textContent = 'Restore Defaults';
      resetBtn.onclick = () => {
        if (confirm('Restore factory settings?')) {
          config = JSON.parse(JSON.stringify(defaultConfig));
          saveConfig();
          renderHeader();
          renderAdminPanel();
        }
      };
      tools.appendChild(exportBtn);
      tools.appendChild(importBtn);
      tools.appendChild(resetBtn);
      advWrap.appendChild(tools);
      details.appendChild(advWrap);
      adv.appendChild(details);
      content.appendChild(adv);
      // save & close buttons
      const actions = document.createElement('div');
      actions.className = 'btn-row';
      const saveBtn = document.createElement('button');
      saveBtn.textContent = 'Save';
      saveBtn.onclick = () => {
        saveConfig();
        adminUnlocked = false;
        closeAdmin();
        render();
      };
      const cancelBtn = document.createElement('button');
      cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = () => { adminUnlocked = false; closeAdmin(); };
      actions.appendChild(cancelBtn);
      actions.appendChild(saveBtn);
      content.appendChild(actions);
    }

    function saveConfig() {
      // Persist configuration only if storage is available.  When running
      // locally on a device where localStorage is disabled the config will
      // remain in memory for the current session.
      if (storageAvailable) {
        try {
          localStorage.setItem('config', JSON.stringify(config));
        } catch (e) {
          console.warn('Unable to save config to storage', e);
        }
      }
    }

    // Event listeners
    document.getElementById('adminBtn').addEventListener('click', openAdmin);
    // Close modal when clicking outside content
    document.getElementById('adminModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('adminModal')) {
        adminUnlocked = false;
        closeAdmin();
      }
    });

    // Initial render
    render();
  </script>
</body>
</html>
